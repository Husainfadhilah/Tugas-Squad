
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk</title>
    <link rel="stylesheet" href="tugas-03b.css">
</head>
<body>

    <header>
        <h1>Katalog Produk</h1>
        <p>Pilih produk favoritmu</p>
    </header>

    <main class="container">

        <div class="card">
            <img src="https://placehold.co/300x200?text=Produk+1" alt="Produk pertama">
            <div class="card-content">
                <h2>Produk Pertama</h2>
                <p>Produk berkualitas dengan harga terjangkau.</p>
                <span class="status tersedia">Stok Tersedia</span>
                <h3>Rp25.000</h3>
            </div>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Produk+2" alt="Produk kedua">
            <div class="card-content">
                <h2>Produk Kedua</h2>
                <p>Produk pilihan dengan kualitas terbaik.</p>
                <span class="status habis">Stok Habis</span>
                <h3>Rp35.000</h3>
            </div>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200?text=Produk+3" alt="Produk ketiga">
            <div class="card-content">
                <h2>Produk Ketiga</h2>
                <p>Produk praktis untuk kebutuhan sehari-hari.</p>
                <span class="status tersedia">Stok Tersedia</span>
                <h3>Rp45.000</h3>
            </div>
        </div>

    </main>

</body>
</html>
